<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Catálogo de Cirugía Periodontal</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      line-height: 1.5;
      color: #1f1f1f;
      background-color: #ffffff;
    }

    main {
      min-height: 200px;
      padding: 2rem 1.5rem;
    }

    .pink-banner {
      position: relative;
      background-color: #f8c8dc;
      padding: 2.25rem 1.5rem;
      text-align: center;
      overflow: hidden;
    }

    .pink-banner h3 {
      margin-bottom: 0.4rem;
      font-size: 1.25rem;
    }

    .star {
      position: absolute;
      font-size: 1rem;
      opacity: 0.7;
      user-select: none;
    }

    .star-7 {
      top: 16px;
      left: 12%;
    }

    .star-8 {
      bottom: 16px;
      right: 12%;
    }

    .lilac-footer {
      background-color: #d8c7f3;
      padding: 2rem 1.5rem;
      display: flex;
      flex-direction: column;
      gap: 1.25rem;
    }

    .footer-logo {
      font-weight: 700;
      font-size: 1.1rem;
      margin-bottom: 0.25rem;
    }

    .footer-links {
      display: flex;
      flex-wrap: wrap;
      gap: 1rem;
      font-size: 0.9rem;
      font-weight: 600;
    }

    .footer-bottom {
      border-top: 1px solid rgba(0, 0, 0, 0.12);
      padding-top: 1rem;
      font-size: 0.8rem;
    }
  </style>
</head>
<body>
  <main>
    <!-- Pega aquí el contenido principal de tu catálogo si tenías algo más arriba -->
  </main>

  <!-- Franja rosa inferior -->
  <section class="pink-banner">
    <span class="star star-7" aria-hidden="true">✦</span>
    <span class="star star-8" aria-hidden="true">✦</span>
    <h3>Organizado por tiempos quirúrgicos</h3>
    <p>Ideal para repaso clínico, prácticas de laboratorio y consulta rápida.</p>
  </section>

  <!-- Footer lila -->
  <footer class="lilac-footer">
    <div class="footer-brand">
      <div class="footer-logo">NICOLE &amp; LUCERO</div>
      <p>Catálogo de Cirugía Periodontal</p>
    </div>

    <div class="footer-links">
      <span>INCISIÓN</span>
      <span>LIMPIEZA</span>
      <span>CIRUGÍA ÓSEA</span>
      <span>SUTURA</span>
    </div>

    <div class="footer-bottom">
      <span>CATÁLOGO ACADÉMICO · CIRUGÍA PERIODONTAL</span>
    </div>
  </footer>
</body>
</html>
