<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Catálogo Periodontal Clínico</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="header">
    <div class="container">
      <h1>Catálogo Periodontal</h1>
      <p>Guía clínica de diagnósticos, procedimientos quirúrgicos y no quirúrgicos</p>
    </div>
  </header>

  <main class="container">
    <section class="controls">
      <input 
        type="text" 
        id="searchInput" 
        placeholder="Buscar por nombre, código o indicación..." 
        aria-label="Buscar tratamiento periodontal"
      />
      <div class="filters" id="categoryFilters">
        <button class="filter-btn active" data-category="all">Todos</button>
        <button class="filter-btn" data-category="Diagnostico">Diagnóstico</button>
        <button class="filter-btn" data-category="No Quirurgico">Terapia No Quirúrgica</button>
        <button class="filter-btn" data-category="Quirurgico">Cirugía Periodontal</button>
        <button class="filter-btn" data-category="Regenerativo">Regeneración / Mucogingival</button>
      </div>
    </section>

    <section id="catalogGrid" class="catalog-grid">
      <!-- Las tarjetas se generan dinámicamente desde app.js -->
    </section>
  </main>

  <!-- Modal de detalle -->
  <div id="detailModal" class="modal hidden" role="dialog" aria-modal="true">
    <div class="modal-content">
      <button id="closeModal" class="close-btn" aria-label="Cerrar">&times;</button>
      <span id="modalCode" class="badge"></span>
      <h2 id="modalTitle"></h2>
      <p id="modalCategory" class="modal-category"></p>
      <hr />
      <div class="modal-body">
        <p><strong>Descripción clínica:</strong> <span id="modalDescription"></span></p>
        <p><strong>Indicaciones:</strong> <span id="modalIndications"></span></p>
        <p><strong>Instrumental / Protocolo:</strong> <span id="modalProtocol"></span></p>
      </div>
    </div>
  </div>

  <footer class="footer">
    <div class="container">
      <p>Catálogo Periodontal &copy; 2026 — Uso Clínico y Académico</p>
    </div>
  </footer>

  <script src="app.js"></script>
</body>
</html>
